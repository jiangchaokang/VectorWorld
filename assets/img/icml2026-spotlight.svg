<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 240" width="700" height="240">
  <defs>

    <!-- 背景渐变：深紫黑 -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0b18"/>
      <stop offset="50%" stop-color="#150d28"/>
      <stop offset="100%" stop-color="#0a0812"/>
    </linearGradient>

    <!-- 头像渐变：深紫灰 -->
    <linearGradient id="headGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d2040"/>
      <stop offset="100%" stop-color="#1c1530"/>
    </linearGradient>

    <!-- 扫描光束渐变：紫色 -->
    <linearGradient id="scanBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#c084fc" stop-opacity="0"/>
      <stop offset="45%"  stop-color="#c084fc" stop-opacity="0.06"/>
      <stop offset="50%"  stop-color="#c084fc" stop-opacity="0.95"/>
      <stop offset="55%"  stop-color="#c084fc" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>

    <!-- SPOTLIGHT 文字发光：琥珀金 -->
    <filter id="amberGlow" x="-12%" y="-12%" width="124%" height="124%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feFlood flood-color="#f59e0b" flood-opacity="0.55" result="color"/>
      <feComposite in="color" in2="b" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- ICML 文字柔和发光：白紫 -->
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 头部裁切 -->
    <clipPath id="headMask">
      <path d="M55,190 L55,150 C36,143 26,128 24,110
               L22,86 C20,50 44,18 90,12
               C136,6 170,32 172,72
               L174,97 C176,124 161,144 144,150
               L144,162 C144,167 140,170 135,170
               L135,180 C150,182 160,188 160,195
               L55,195 Z"/>
    </clipPath>

    <!-- 网格图案：深紫 -->
    <pattern id="grid" x="0" y="0" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22,0 L0,0 L0,22" fill="none" stroke="#2e1e4a" stroke-width="0.6" opacity="0.5"/>
    </pattern>

    <!-- 粒子发光 -->
    <filter id="dotGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <!-- ========== 背景层 ========== -->
  <rect width="700" height="240" fill="url(#bg)" rx="14"/>
  <rect width="700" height="240" fill="url(#grid)" rx="14" opacity="0.7"/>

  <!-- 背景中央暗晕（深度感） -->
  <ellipse cx="380" cy="120" rx="320" ry="100" fill="#1e0f38" opacity="0.4">
    <animate attributeName="rx" values="300;360;300" dur="6s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.4 1"/>
    <animate attributeName="opacity" values="0.3;0.5;0.3" dur="6s" repeatCount="indefinite"/>
  </ellipse>

  <!-- ========== 背景粒子流（紫+金+玫瑰） ========== -->
  <g filter="url(#dotGlow)">
    <circle cx="565" cy="0" r="1.5" fill="#a855f7">
      <animate attributeName="cy" values="-5;245" dur="4.2s" repeatCount="indefinite" begin="0s"/>
      <animate attributeName="opacity" values="0;0.9;0.9;0" dur="4.2s" repeatCount="indefinite" begin="0s"/>
    </circle>
    <circle cx="590" cy="0" r="1" fill="#f59e0b">
      <animate attributeName="cy" values="-5;245" dur="3.6s" repeatCount="indefinite" begin="0.8s"/>
      <animate attributeName="opacity" values="0;0.8;0.8;0" dur="3.6s" repeatCount="indefinite" begin="0.8s"/>
    </circle>
    <circle cx="618" cy="0" r="2" fill="#e879f9">
      <animate attributeName="cy" values="-5;245" dur="5s" repeatCount="indefinite" begin="1.4s"/>
      <animate attributeName="opacity" values="0;0.7;0.7;0" dur="5s" repeatCount="indefinite" begin="1.4s"/>
    </circle>
    <circle cx="645" cy="0" r="1.5" fill="#fbbf24">
      <animate attributeName="cy" values="-5;245" dur="3.9s" repeatCount="indefinite" begin="2.1s"/>
      <animate attributeName="opacity" values="0;0.85;0.85;0" dur="3.9s" repeatCount="indefinite" begin="2.1s"/>
    </circle>
    <circle cx="670" cy="0" r="1" fill="#c084fc">
      <animate attributeName="cy" values="-5;245" dur="4.5s" repeatCount="indefinite" begin="0.4s"/>
      <animate attributeName="opacity" values="0;0.9;0.9;0" dur="4.5s" repeatCount="indefinite" begin="0.4s"/>
    </circle>
    <circle cx="692" cy="0" r="1.5" fill="#f472b6">
      <animate attributeName="cy" values="-5;245" dur="3.3s" repeatCount="indefinite" begin="1.8s"/>
      <animate attributeName="opacity" values="0;0.75;0.75;0" dur="3.3s" repeatCount="indefinite" begin="1.8s"/>
    </circle>
    <circle cx="540" cy="0" r="1" fill="#a78bfa">
      <animate attributeName="cy" values="-5;245" dur="4.8s" repeatCount="indefinite" begin="3s"/>
      <animate attributeName="opacity" values="0;0.7;0.7;0" dur="4.8s" repeatCount="indefinite" begin="3s"/>
    </circle>
  </g>

  <!-- ========== 左侧 LOGO 区域 ========== -->
  <g transform="translate(20, 10)">

    <!-- 2×2 彩色像素方块（对应原图：红/绿/蓝/青，慢速呼吸） -->
    <g>
      <rect x="14" y="14" width="14" height="14" rx="2.5" fill="#e53e3e">
        <animate attributeName="opacity" values="1;0.45;1" dur="2.4s" begin="0s" repeatCount="indefinite"/>
      </rect>
      <rect x="30" y="14" width="14" height="14" rx="2.5" fill="#38a169">
        <animate attributeName="opacity" values="1;0.45;1" dur="2.4s" begin="0.6s" repeatCount="indefinite"/>
      </rect>
      <rect x="14" y="30" width="14" height="14" rx="2.5" fill="#3182ce">
        <animate attributeName="opacity" values="1;0.45;1" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
      </rect>
      <rect x="30" y="30" width="14" height="14" rx="2.5" fill="#00b5d8">
        <animate attributeName="opacity" values="1;0.45;1" dur="2.4s" begin="1.8s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- ===== 人头剪影 ===== -->
    <g transform="translate(0, 5)">

      <!-- 脖子 -->
      <rect x="84" y="152" width="18" height="18" rx="2" fill="#251c3a"/>
      <!-- 肩台 -->
      <rect x="60" y="166" width="64" height="12" rx="4" fill="#251c3a"/>

      <!-- 头部主轮廓 -->
      <path d="
        M72,152
        C54,148 38,133 35,113
        L33,90
        C31,60 52,28 92,20
        C132,12 163,38 165,74
        L167,98
        C169,125 154,145 137,151
        L135,153
        L135,163
        C135,167 131,169 127,169
        L127,171
        L85,171
        L85,163
        C77,161 74,158 72,152 Z
      " fill="#251c3a">
        <animate attributeName="fill" values="#251c3a;#2e2248;#251c3a" dur="3s" repeatCount="indefinite"/>
      </path>

      <!-- 头部高光（顶部） -->
      <path d="
        M92,20 C132,12 163,38 165,74 L167,96
        C164,76 148,36 108,28 C78,23 57,40 54,66 Z
      " fill="#3d2f5e" opacity="0.45"/>

      <!-- 眼区暗影 -->
      <ellipse cx="100" cy="90" rx="34" ry="11" fill="#130d20" opacity="0.55"/>

      <!-- 扫描光束（紫色） -->
      <rect x="33" y="0" width="136" height="7"
            fill="url(#scanBeam)" opacity="0"
            clip-path="url(#headMask)">
        <animate attributeName="y"       values="20;178;20" dur="2.4s" repeatCount="indefinite" calcMode="linear"/>
        <animate attributeName="opacity" values="0;1;1;0"   dur="2.4s" repeatCount="indefinite"/>
      </rect>

      <!-- 像素化白色方块（异步慢速闪烁） -->
      <rect x="130" y="36"  width="12" height="12" rx="1.5" fill="white" opacity="0">
        <animate attributeName="opacity" values="0;0.85;0" dur="2.2s" begin="0.0s" repeatCount="indefinite"/>
      </rect>
      <rect x="145" y="47"  width="10" height="10" rx="1.5" fill="#d4c4f0" opacity="0">
        <animate attributeName="opacity" values="0;0.7;0"  dur="2.6s" begin="0.4s" repeatCount="indefinite"/>
      </rect>
      <rect x="118" y="43"  width="10" height="10" rx="1.5" fill="white" opacity="0">
        <animate attributeName="opacity" values="0;0.75;0" dur="3.0s" begin="0.9s" repeatCount="indefinite"/>
      </rect>
      <rect x="139" y="54"  width="8"  height="8"  rx="1"   fill="#a78bfa" opacity="0">
        <animate attributeName="opacity" values="0;0.65;0" dur="2.4s" begin="1.3s" repeatCount="indefinite"/>
      </rect>
      <rect x="153" y="62"  width="8"  height="8"  rx="1"   fill="white" opacity="0">
        <animate attributeName="opacity" values="0;0.6;0"  dur="2.8s" begin="0.6s" repeatCount="indefinite"/>
      </rect>
      <rect x="122" y="56"  width="6"  height="6"  rx="1"   fill="#d4c4f0" opacity="0">
        <animate attributeName="opacity" values="0;0.8;0"  dur="2.0s" begin="1.7s" repeatCount="indefinite"/>
      </rect>
      <rect x="108" y="34"  width="8"  height="8"  rx="1"   fill="white" opacity="0">
        <animate attributeName="opacity" values="0;0.7;0"  dur="3.2s" begin="2.1s" repeatCount="indefinite"/>
      </rect>
      <rect x="159" y="41"  width="6"  height="6"  rx="1"   fill="#a78bfa" opacity="0">
        <animate attributeName="opacity" values="0;0.75;0" dur="2.1s" begin="0.2s" repeatCount="indefinite"/>
      </rect>
      <rect x="46"  y="60"  width="8"  height="8"  rx="1"   fill="#d4c4f0" opacity="0">
        <animate attributeName="opacity" values="0;0.5;0"  dur="3.5s" begin="1.5s" repeatCount="indefinite"/>
      </rect>
      <rect x="55"  y="44"  width="6"  height="6"  rx="1"   fill="white" opacity="0">
        <animate attributeName="opacity" values="0;0.45;0" dur="2.9s" begin="2.5s" repeatCount="indefinite"/>
      </rect>

      <!-- 能量横线（紫色射线，慢速） -->
      <line x1="100" y1="118" x2="100" y2="118"
            stroke="#c084fc" stroke-width="1.5" opacity="0" stroke-linecap="round">
        <animate attributeName="x2"      values="100;166;100" dur="3s" repeatCount="indefinite" begin="0.8s"/>
        <animate attributeName="opacity" values="0;0.7;0"     dur="3s" repeatCount="indefinite" begin="0.8s"/>
      </line>
      <line x1="100" y1="118" x2="100" y2="118"
            stroke="#c084fc" stroke-width="1.5" opacity="0" stroke-linecap="round">
        <animate attributeName="x2"      values="100;32;100"  dur="3s" repeatCount="indefinite" begin="0.8s"/>
        <animate attributeName="opacity" values="0;0.7;0"     dur="3s" repeatCount="indefinite" begin="0.8s"/>
      </line>

    </g>
  </g>

  <!-- ========== 文字区域 ========== -->
  <g transform="translate(220, 0)">

    <!-- ICML 2026：纯慢速呼吸，无闪烁 -->
    <text x="0" y="112"
          font-family="'Arial Black','Impact',sans-serif"
          font-size="72" font-weight="900"
          fill="white" filter="url(#softGlow)"
          letter-spacing="2">
      ICML 2026
      <animate attributeName="opacity" values="0.75;1;0.75" dur="4s" repeatCount="indefinite"
               calcMode="spline" keySplines="0.4 0 0.4 1"/>
    </text>

    <!-- SPOTLIGHT：琥珀金 + 脉冲光晕 -->
    <g>
      <!-- 发光底层 -->
      <text x="0" y="162"
            font-family="'Arial Black','Impact',sans-serif"
            font-size="60" font-weight="900"
            fill="#f59e0b" filter="url(#amberGlow)"
            letter-spacing="4">
        SPOTLIGHT
        <animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite"
                 calcMode="spline" keySplines="0.4 0 0.4 1"/>
      </text>
      <!-- 主层 -->
      <text x="0" y="162"
            font-family="'Arial Black','Impact',sans-serif"
            font-size="60" font-weight="900"
            fill="#fbbf24" letter-spacing="4">
        SPOTLIGHT
      </text>
    </g>

    <!-- 下划线 + 流光（琥珀金） -->
    <g>
      <!-- 主线 -->
      <rect x="0" y="174" width="420" height="3.5" rx="2" fill="#f59e0b" opacity="0.8">
        <animate attributeName="opacity" values="0.5;0.95;0.5" dur="2.5s" repeatCount="indefinite"/>
      </rect>
      <!-- 流光 1 -->
      <rect y="172" width="90" height="7" rx="3.5" fill="white" opacity="0">
        <animate attributeName="x"       values="-90;430"  dur="2.2s" repeatCount="indefinite"
                 calcMode="spline" keySplines="0.3 0 0.6 1" begin="0s"/>
        <animate attributeName="opacity" values="0;0.85;0" dur="2.2s" repeatCount="indefinite" begin="0s"/>
      </rect>
      <!-- 流光 2（延迟，玫瑰金） -->
      <rect y="172" width="55" height="7" rx="3.5" fill="#f472b6" opacity="0">
        <animate attributeName="x"       values="-55;430"  dur="2.2s" repeatCount="indefinite"
                 calcMode="spline" keySplines="0.3 0 0.6 1" begin="1.1s"/>
        <animate attributeName="opacity" values="0;0.6;0"  dur="2.2s" repeatCount="indefinite" begin="1.1s"/>
      </rect>
    </g>

  </g>

  <!-- ========== 底部副标题 ========== -->
  <text x="350" y="222"
        font-family="Arial,sans-serif" font-size="10.5"
        fill="#7c5f9a" text-anchor="middle" letter-spacing="2.5">
    ICML · INTERNATIONAL CONFERENCE ON MACHINE LEARNING
    <animate attributeName="opacity" values="0.45;0.85;0.45" dur="5s" repeatCount="indefinite"/>
  </text>

  <!-- ========== 右上角装饰点阵（紫+金+玫瑰） ========== -->
  <g filter="url(#dotGlow)">
    <!-- 行 1 -->
    <circle cx="616" cy="22" r="2.2" fill="#a855f7">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.0s" begin="0.0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="634" cy="22" r="2.2" fill="#f59e0b">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.0s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="652" cy="22" r="2.2" fill="#e879f9">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.0s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="670" cy="22" r="2.2" fill="#fbbf24">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.0s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="688" cy="22" r="2.2" fill="#c084fc">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.0s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <!-- 行 2 -->
    <circle cx="616" cy="40" r="2.2" fill="#f472b6">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.0s" begin="0.15s" repeatCount="indefinite"/>
    </circle>
    <circle cx="634" cy="40" r="2.2" fill="#a855f7">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.0s" begin="0.45s" repeatCount="indefinite"/>
    </circle>
    <circle cx="652" cy="40" r="2.2" fill="#fbbf24">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.0s" begin="0.75s" repeatCount="indefinite"/>
    </circle>
    <circle cx="670" cy="40" r="2.2" fill="#e879f9">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.0s" begin="1.05s" repeatCount="indefinite"/>
    </circle>
    <circle cx="688" cy="40" r="2.2" fill="#f59e0b">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.0s" begin="1.35s" repeatCount="indefinite"/>
    </circle>
    <!-- 行 3 -->
    <circle cx="616" cy="58" r="2.2" fill="#c084fc">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.0s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="634" cy="58" r="2.2" fill="#f472b6">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.0s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="652" cy="58" r="2.2" fill="#a855f7">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.0s" begin="1.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="670" cy="58" r="2.2" fill="#fbbf24">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.0s" begin="1.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="688" cy="58" r="2.2" fill="#e879f9">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.0s" begin="1.7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ========== 右下电路装饰（紫金色调） ========== -->
  <g opacity="0.5">
    <path d="M596,192 L638,192 L638,213 L682,213"
          fill="none" stroke="#4a2a6e" stroke-width="1.8" stroke-linecap="round">
      <animate attributeName="stroke" values="#4a2a6e;#c084fc;#4a2a6e" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M612,182 L612,198"
          fill="none" stroke="#4a2a6e" stroke-width="1.8" stroke-linecap="round">
      <animate attributeName="stroke" values="#4a2a6e;#f59e0b;#4a2a6e" dur="3s" begin="0.6s" repeatCount="indefinite"/>
    </path>
    <circle cx="612" cy="182" r="3.5" fill="#4a2a6e">
      <animate attributeName="fill"   values="#4a2a6e;#f59e0b;#4a2a6e" dur="3s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="r"      values="3.5;5;3.5"               dur="3s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="638" cy="192" r="3.5" fill="#4a2a6e">
      <animate attributeName="fill"   values="#4a2a6e;#c084fc;#4a2a6e" dur="3s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="r"      values="3.5;5;3.5"               dur="3s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="682" cy="213" r="3.5" fill="#4a2a6e">
      <animate attributeName="fill"   values="#4a2a6e;#f472b6;#4a2a6e" dur="3s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="r"      values="3.5;5;3.5"               dur="3s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ========== 边框 + 顶部扫光 ========== -->
  <rect x="1" y="1" width="698" height="238"
        fill="none" stroke="#3b1f5e" stroke-width="1.5" rx="13"/>

  <!-- 顶边流光 -->
  <rect x="0" y="0" width="0" height="2" rx="1" fill="#c084fc" opacity="0">
    <animate attributeName="width"   values="0;700;0"   dur="4s" repeatCount="indefinite" begin="0s"/>
    <animate attributeName="opacity" values="0;0.9;0"   dur="4s" repeatCount="indefinite" begin="0s"/>
  </rect>
  <!-- 右边流光 -->
  <rect x="698" y="0" width="2" height="0" rx="1" fill="#f59e0b" opacity="0">
    <animate attributeName="height"  values="0;240;0"   dur="4s" repeatCount="indefinite" begin="2s"/>
    <animate attributeName="opacity" values="0;0.9;0"   dur="4s" repeatCount="indefinite" begin="2s"/>
  </rect>

</svg>
